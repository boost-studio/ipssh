<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">ipssh architecture</title>
  <desc id="desc">The user runs ipssh. ipssh calls native ssh.exe and scp.exe tools.</desc>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#08745F"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.4; filter: url(#shadow); }
      .container { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
      .tools { fill: #f8fbff; stroke: #60a5fa; stroke-width: 1.6; }
      .band { fill: #eef2f6; stroke: #cbd5e1; stroke-width: 1.2; }
      .blue { fill: #eff8ff; stroke: #2e90fa; stroke-width: 1.7; }
      .green { fill: #ecfdf3; stroke: #12b76a; stroke-width: 1.7; }
      .amber { fill: #fff8e8; stroke: #f79009; stroke-width: 1.6; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.1; }
      .decision { fill: #f0fdf9; stroke: #0d9488; stroke-width: 1.6; }
      .badge { fill: #344054; }
      .title { fill: #101828; font: 700 28px "Segoe UI", Arial, sans-serif; }
      .subtitle { fill: #475467; font: 400 16px "Segoe UI", Arial, sans-serif; }
      .sectionTitle { fill: #101828; font: 700 18px "Segoe UI", Arial, sans-serif; }
      .label { fill: #101828; font: 700 17px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .small { fill: #475467; font: 400 14px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .tiny { fill: #667085; font: 400 12px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .badgeText { fill: #ffffff; font: 700 12px "Segoe UI", Arial, sans-serif; letter-spacing: .4px; text-anchor: middle; }
      .darkLine { fill: none; stroke: #344054; stroke-width: 2.3; marker-end: url(#arrowDark); }
      .darkReturn { fill: none; stroke: #98a2b3; stroke-width: 1.9; stroke-dasharray: 7 7; marker-end: url(#arrowDark); }
      .greenLine { fill: none; stroke: #08745F; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .mutedLine { fill: none; stroke: #98a2b3; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#arrowDark); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect class="panel" x="36" y="30" width="1208" height="700" rx="18"/>

  <text class="title" x="78" y="78">ipssh architecture</text>
  <text class="subtitle" x="78" y="108">ipssh wraps native OpenSSH tools: ssh.exe owns the terminal session, scp.exe uploads images.</text>

  <rect class="blue" x="72" y="206" width="198" height="82" rx="12"/>
  <text class="label" x="171" y="240">User</text>
  <text class="small" x="171" y="264">Windows Terminal</text>

  <rect class="container" x="318" y="138" width="620" height="538" rx="20"/>
  <text class="sectionTitle" x="348" y="174">ipssh process</text>
  <text class="subtitle" x="348" y="198">orchestrates native tools; does not implement SSH</text>

  <rect class="band" x="352" y="222" width="552" height="150" rx="16"/>
  <rect class="badge" x="374" y="244" width="142" height="30" rx="15"/>
  <text class="badgeText" x="445" y="264">terminal path</text>

  <rect class="blue" x="410" y="294" width="190" height="58" rx="11"/>
  <text class="label" x="505" y="319">calls</text>
  <text class="small" x="505" y="340">ssh.exe</text>

  <rect class="note" x="624" y="286" width="238" height="74" rx="10"/>
  <text class="tiny" x="743" y="309">Native terminal behavior</text>
  <text class="tiny" x="743" y="327">stays intact: text paste,</text>
  <text class="tiny" x="743" y="345">Ctrl+C, Ctrl+D, full-screen apps</text>

  <rect class="band" x="352" y="414" width="552" height="226" rx="16"/>
  <rect class="badge" x="374" y="436" width="150" height="30" rx="15"/>
  <text class="badgeText" x="449" y="456">image sidecar</text>

  <rect class="green" x="388" y="496" width="142" height="70" rx="11"/>
  <text class="label" x="459" y="524">Alt+V</text>
  <text class="small" x="459" y="546">hotkey</text>

  <rect class="green" x="570" y="496" width="146" height="70" rx="11"/>
  <text class="label" x="643" y="524">Clipboard</text>
  <text class="small" x="643" y="546">image only</text>

  <rect class="green" x="756" y="496" width="126" height="70" rx="11"/>
  <text class="label" x="819" y="524">Cache</text>
  <text class="small" x="819" y="546">last image</text>

  <path class="decision" d="M 754 604 L 819 570 L 884 604 L 819 638 Z"/>
  <text class="tiny" x="819" y="599">same</text>
  <text class="tiny" x="819" y="615">image?</text>

  <rect class="amber" x="488" y="590" width="210" height="42" rx="10"/>
  <text class="small" x="593" y="608">non-image paste</text>
  <text class="tiny" x="593" y="624">left to Windows Terminal</text>

  <rect class="tools" x="986" y="138" width="226" height="538" rx="20"/>
  <text class="sectionTitle" x="1016" y="174">native OpenSSH tools</text>

  <rect class="blue" x="1026" y="232" width="150" height="78" rx="11"/>
  <text class="label" x="1101" y="264">ssh.exe</text>
  <text class="small" x="1101" y="288">terminal I/O</text>

  <rect class="green" x="1026" y="480" width="150" height="78" rx="11"/>
  <text class="label" x="1101" y="512">scp.exe</text>
  <text class="small" x="1101" y="536">upload PNG</text>

  <rect class="green" x="1026" y="584" width="150" height="56" rx="11"/>
  <text class="small" x="1101" y="606">mkdir if needed</text>
  <text class="tiny" x="1101" y="624">before upload</text>

  <rect class="blue" x="1026" y="346" width="150" height="74" rx="11"/>
  <text class="label" x="1101" y="378">SSH server</text>
  <text class="small" x="1101" y="400">remote shell</text>

  <rect class="note" x="946" y="690" width="256" height="44" rx="10"/>
  <text class="tiny" x="1074" y="709">Yes: reuse cached remote path</text>
  <text class="tiny" x="1074" y="725">and paste it without scp.exe</text>

  <path class="darkLine" d="M 270 247 L 318 247"/>
  <text class="tiny" x="294" y="232">runs</text>

  <path class="darkLine" d="M 600 323 L 986 271"/>
  <path class="darkLine" d="M 1101 310 L 1101 346"/>
  <path class="darkReturn" d="M 1026 400 C 948 438, 916 392, 862 360"/>

  <path class="greenLine" d="M 530 531 L 570 531"/>
  <path class="greenLine" d="M 716 531 L 756 531"/>
  <path class="greenLine" d="M 819 566 L 819 570"/>
  <path class="greenLine" d="M 884 604 C 928 570, 966 532, 1026 519"/>
  <text class="tiny" x="952" y="554">No: upload</text>
  <path class="greenLine" d="M 819 638 C 850 700, 894 712, 946 712"/>
  <text class="tiny" x="890" y="692">Yes</text>
  <path class="greenLine" d="M 1101 480 L 1101 420"/>
  <path class="mutedLine" d="M 643 566 L 643 590"/>
</svg>
