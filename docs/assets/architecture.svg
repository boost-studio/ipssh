<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ipssh architecture</title>
  <desc id="desc">OpenSSH owns the interactive terminal. ipssh only handles clipboard image paste events.</desc>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#08745F"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.4; filter: url(#shadow); }
      .band { fill: #eef2f6; stroke: #cbd5e1; stroke-width: 1.2; }
      .blue { fill: #eff8ff; stroke: #2e90fa; stroke-width: 1.7; }
      .green { fill: #ecfdf3; stroke: #12b76a; stroke-width: 1.7; }
      .amber { fill: #fff8e8; stroke: #f79009; stroke-width: 1.6; }
      .note { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.1; }
      .badge { fill: #344054; }
      .title { fill: #101828; font: 700 28px "Segoe UI", Arial, sans-serif; }
      .subtitle { fill: #475467; font: 400 16px "Segoe UI", Arial, sans-serif; }
      .label { fill: #101828; font: 700 17px "Segoe UI", Arial, sans-serif; }
      .small { fill: #475467; font: 400 14px "Segoe UI", Arial, sans-serif; }
      .tiny { fill: #667085; font: 400 12px "Segoe UI", Arial, sans-serif; }
      .badgeText { fill: #ffffff; font: 700 12px "Segoe UI", Arial, sans-serif; letter-spacing: .4px; }
      .darkLine { fill: none; stroke: #344054; stroke-width: 2.3; marker-end: url(#arrowDark); }
      .darkReturn { fill: none; stroke: #98a2b3; stroke-width: 1.9; stroke-dasharray: 7 7; marker-end: url(#arrowDark); }
      .greenLine { fill: none; stroke: #08745F; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .greenReturn { fill: none; stroke: #08745F; stroke-width: 2.2; stroke-dasharray: 7 7; marker-end: url(#arrowGreen); }
      .mutedLine { fill: none; stroke: #98a2b3; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#arrowDark); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <rect class="panel" x="38" y="32" width="1204" height="650" rx="18"/>

  <text class="title" x="82" y="82">ipssh architecture</text>
  <text class="subtitle" x="82" y="112">OpenSSH keeps terminal behavior native. ipssh only handles clipboard images and pastes the uploaded remote path.</text>

  <rect class="band" x="78" y="150" width="1124" height="190" rx="16"/>
  <rect class="badge" x="104" y="174" width="120" height="30" rx="15"/>
  <text class="badgeText" x="124" y="194">native SSH</text>

  <rect class="blue" x="112" y="234" width="205" height="72" rx="11"/>
  <text class="label" x="178" y="265">User</text>
  <text class="small" x="157" y="288">Windows Terminal</text>

  <rect class="blue" x="432" y="224" width="230" height="92" rx="11"/>
  <text class="label" x="495" y="260">ssh.exe</text>
  <text class="small" x="482" y="285">owns stdin</text>
  <text class="small" x="480" y="303">and stdout</text>

  <rect class="blue" x="888" y="224" width="230" height="92" rx="11"/>
  <text class="label" x="954" y="260">SSH server</text>
  <text class="small" x="942" y="285">remote shell</text>
  <text class="small" x="956" y="303">and tools</text>

  <rect class="note" x="492" y="164" width="350" height="44" rx="10"/>
  <text class="tiny" x="520" y="184">Normal terminal behavior stays native:</text>
  <text class="tiny" x="520" y="200">text paste, multiline paste, Ctrl+C, Ctrl+D</text>

  <path class="darkLine" d="M 317 270 L 432 270"/>
  <path class="darkLine" d="M 662 270 L 888 270"/>
  <path class="darkReturn" d="M 888 301 C 810 344, 742 344, 662 301"/>

  <rect class="band" x="78" y="382" width="1124" height="246" rx="16"/>
  <rect class="badge" x="104" y="406" width="150" height="30" rx="15"/>
  <text class="badgeText" x="125" y="426">image sidecar</text>

  <rect class="green" x="112" y="466" width="210" height="82" rx="11"/>
  <text class="label" x="189" y="500">Alt+V</text>
  <text class="small" x="157" y="525">hotkey hook</text>

  <rect class="green" x="388" y="466" width="215" height="82" rx="11"/>
  <text class="label" x="452" y="500">Clipboard</text>
  <text class="small" x="460" y="525">image only</text>

  <rect class="green" x="670" y="466" width="225" height="82" rx="11"/>
  <text class="label" x="722" y="500">Upload worker</text>
  <text class="small" x="722" y="525">cache last image</text>

  <rect class="green" x="966" y="430" width="205" height="66" rx="11"/>
  <text class="label" x="1022" y="469">ssh mkdir</text>

  <rect class="green" x="966" y="542" width="205" height="66" rx="11"/>
  <text class="label" x="1028" y="581">scp PNG</text>

  <rect class="amber" x="392" y="578" width="260" height="34" rx="10"/>
  <text class="small" x="430" y="600">non-image paste passes through</text>

  <rect class="note" x="576" y="638" width="430" height="44" rx="10"/>
  <text class="tiny" x="604" y="658">To insert the path: set clipboard text, send Shift+Insert,</text>
  <text class="tiny" x="604" y="674">then restore the previous clipboard content where possible.</text>

  <rect class="note" x="1014" y="340" width="170" height="42" rx="10"/>
  <text class="tiny" x="1040" y="358">Rendered remote</text>
  <text class="tiny" x="1058" y="374">file path</text>

  <path class="greenLine" d="M 322 507 L 388 507"/>
  <path class="greenLine" d="M 603 507 L 670 507"/>
  <path class="greenLine" d="M 895 492 C 925 480, 938 467, 966 463"/>
  <path class="greenLine" d="M 895 523 C 926 538, 938 562, 966 575"/>
  <path class="greenLine" d="M 1068 430 L 1068 382"/>
  <path class="greenLine" d="M 1068 340 L 1068 316"/>
  <path class="greenReturn" d="M 670 546 C 560 632, 330 632, 217 548"/>
  <path class="mutedLine" d="M 496 548 L 496 578"/>
</svg>
