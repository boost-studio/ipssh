<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">ipssh architecture</title>
  <desc id="desc">ipssh runs inside Windows Terminal, calls native ssh.exe and scp.exe, and connects to a remote SSH server.</desc>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #d0d7e2; stroke-width: 1.3; filter: url(#shadow); }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .ipssh { fill: #f8fafc; stroke: #475569; stroke-width: 1.8; }
      .lane { fill: #eef4fa; stroke: #cbd5e1; stroke-width: 1.2; }
      .nodeBlue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
      .nodeGreen { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .nodeAmber { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
      .nodeNeutral { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .decision { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.5; }
      .badgeDark { fill: #334155; }
      .badgeGreen { fill: #047857; }
      .title { fill: #0f172a; font: 700 28px "Segoe UI", Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 15px "Segoe UI", Arial, sans-serif; }
      .sectionTitle { fill: #0f172a; font: 700 17px "Segoe UI", Arial, sans-serif; }
      .label { fill: #0f172a; font: 700 16px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 400 13px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .tiny { fill: #64748b; font: 400 11.5px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .badgeText { fill: #ffffff; font: 700 12px "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .lineDark { fill: none; stroke: #334155; stroke-width: 1.65; marker-end: url(#arrowDark); }
      .lineGreen { fill: none; stroke: #047857; stroke-width: 1.75; marker-end: url(#arrowGreen); }
      .lineAmber { fill: none; stroke: #b45309; stroke-width: 1.45; stroke-dasharray: 5 6; marker-end: url(#arrowAmber); }
      .lineMuted { fill: none; stroke: #94a3b8; stroke-width: 1.35; stroke-dasharray: 5 6; marker-end: url(#arrowDark); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect class="panel" x="36" y="30" width="1208" height="700" rx="18"/>

  <text class="title" x="76" y="78">ipssh architecture</text>
  <text class="subtitle" x="76" y="106">image paste ssh: keep native SSH terminal behavior, only intercept image paste.</text>

  <rect class="nodeBlue" x="70" y="180" width="200" height="64" rx="12"/>
  <text class="label" x="170" y="216">User</text>

  <rect class="nodeBlue" x="70" y="296" width="200" height="78" rx="12"/>
  <text class="label" x="170" y="329">Windows Terminal</text>
  <text class="small" x="170" y="351">native paste surface</text>

  <rect class="ipssh" x="310" y="138" width="590" height="568" rx="20"/>
  <text class="sectionTitle" x="342" y="174">ipssh process</text>
  <text class="subtitle" x="342" y="198">orchestrates native tools; does not implement SSH</text>

  <rect class="lane" x="342" y="224" width="526" height="138" rx="16"/>
  <rect class="badgeDark" x="364" y="246" width="156" height="30" rx="15"/>
  <text class="badgeText" x="442" y="265">terminal passthrough</text>

  <rect class="nodeBlue" x="392" y="298" width="168" height="48" rx="10"/>
  <text class="label" x="476" y="318">call ssh.exe</text>
  <text class="tiny" x="476" y="336">stdin / stdout owned by ssh</text>

  <rect class="nodeNeutral" x="628" y="288" width="208" height="64" rx="10"/>
  <text class="tiny" x="732" y="310">Text paste, Ctrl+C, Ctrl+D,</text>
  <text class="tiny" x="732" y="328">and full-screen apps pass</text>
  <text class="tiny" x="732" y="346">through unchanged.</text>

  <rect class="lane" x="342" y="400" width="526" height="292" rx="16"/>
  <rect class="badgeGreen" x="364" y="422" width="132" height="30" rx="15"/>
  <text class="badgeText" x="430" y="441">image sidecar</text>

  <rect class="nodeGreen" x="374" y="486" width="110" height="58" rx="10"/>
  <text class="label" x="429" y="509">Alt+V</text>
  <text class="small" x="429" y="529">hotkey</text>

  <path class="decision" d="M 548 515 L 606 482 L 664 515 L 606 548 Z"/>
  <text class="tiny" x="606" y="511">clipboard</text>
  <text class="tiny" x="606" y="527">image?</text>

  <rect class="nodeGreen" x="684" y="486" width="120" height="58" rx="10"/>
  <text class="label" x="744" y="509">Cache</text>
  <text class="small" x="744" y="529">last image</text>

  <path class="decision" d="M 686 594 L 744 562 L 802 594 L 744 626 Z"/>
  <text class="tiny" x="744" y="590">same</text>
  <text class="tiny" x="744" y="606">image?</text>

  <rect class="nodeAmber" x="504" y="578" width="174" height="42" rx="10"/>
  <text class="small" x="591" y="595">non-image paste</text>
  <text class="tiny" x="591" y="611">handled by terminal</text>

  <rect class="nodeGreen" x="584" y="646" width="228" height="42" rx="10"/>
  <text class="small" x="698" y="663">reuse cached remote path</text>
  <text class="tiny" x="698" y="679">no duplicate scp upload</text>

  <rect class="group" x="938" y="138" width="162" height="568" rx="18"/>
  <text class="sectionTitle" x="968" y="174">native tools</text>
  <text class="tiny" x="1019" y="196">Windows OpenSSH</text>

  <rect class="nodeBlue" x="962" y="248" width="114" height="64" rx="10"/>
  <text class="label" x="1019" y="276">ssh.exe</text>
  <text class="small" x="1019" y="296">terminal I/O</text>

  <rect class="nodeGreen" x="962" y="504" width="114" height="78" rx="10"/>
  <text class="label" x="1019" y="533">scp.exe</text>
  <text class="small" x="1019" y="553">mkdir if needed</text>
  <text class="tiny" x="1019" y="570">upload PNG</text>

  <rect class="nodeBlue" x="1130" y="324" width="90" height="96" rx="12"/>
  <text class="label" x="1175" y="360">SSH</text>
  <text class="label" x="1175" y="380">server</text>
  <text class="tiny" x="1175" y="400">remote host</text>

  <path class="lineDark" d="M 170 244 L 170 296"/>
  <text class="tiny" x="202" y="273">keyboard</text>
  <path class="lineDark" d="M 270 335 L 310 335"/>
  <text class="tiny" x="290" y="318">runs ipssh</text>

  <path class="lineDark" d="M 560 306 C 690 246, 824 246, 962 280"/>
  <text class="tiny" x="760" y="254">native terminal path</text>
  <path class="lineDark" d="M 1076 280 C 1110 280, 1122 325, 1130 356"/>
  <text class="tiny" x="1112" y="298">connects</text>

  <path class="lineMuted" d="M 1130 390 C 1056 460, 952 386, 836 336"/>
  <text class="tiny" x="993" y="432">remote shell I/O</text>

  <path class="lineGreen" d="M 484 515 L 548 515"/>
  <path class="lineGreen" d="M 664 515 L 684 515"/>
  <text class="tiny" x="674" y="498">Yes</text>
  <path class="lineAmber" d="M 578 540 L 578 578"/>
  <text class="tiny" x="558" y="562">No</text>
  <path class="lineAmber" d="M 504 599 C 370 598, 262 466, 170 374"/>

  <path class="lineGreen" d="M 744 544 L 744 562"/>
  <path class="lineGreen" d="M 802 594 C 852 594, 900 548, 962 543"/>
  <text class="tiny" x="890" y="568">No: upload</text>
  <path class="lineGreen" d="M 744 626 C 738 640, 718 642, 698 646"/>
  <text class="tiny" x="768" y="642">Yes</text>
  <path class="lineGreen" d="M 1076 543 C 1112 530, 1124 424, 1130 388"/>
  <path class="lineGreen" d="M 1130 406 C 1044 646, 904 667, 812 667"/>
  <text class="tiny" x="1018" y="652">remote file path</text>
</svg>
