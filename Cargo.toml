[package]
name = "ipssh"
version = "0.1.1"
edition = "2021"
description = "Windows OpenSSH wrapper that uploads pasted clipboard images and inserts remote paths"
license = "MIT"

[[bin]]
name = "ipssh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
tempfile = "3"
toml = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
temp-env = "0.3"
