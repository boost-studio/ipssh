name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

  installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Run installer tests
        shell: pwsh
        run: |
          $env:IPSSH_BIN = "${{ github.workspace }}\target\release\ipssh.exe"
          cargo test --manifest-path packaging\windows\installer\Cargo.toml

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1

      - name: Resolve installer path
        id: installer-path
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assetPath = "dist/ipssh-$version-windows-x64-installer.exe"
          if (-not (Test-Path $assetPath)) {
            Write-Error "Installer not found: $assetPath"
          }
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: ipssh-${{ github.ref_name }}-windows-x64-installer
          path: ${{ steps.installer-path.outputs.asset_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assetPath = "${{ steps.installer-path.outputs.asset_path }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assetPath --clobber
          } else {
            gh release create $tag $assetPath `
              --title "ipssh $tag" `
              --generate-notes `
              --verify-tag
          }
