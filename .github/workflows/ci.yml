name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

  installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Run installer tests
        shell: pwsh
        run: |
          $env:IPSSH_BIN = "${{ github.workspace }}\target\release\ipssh.exe"
          cargo test --manifest-path packaging\windows\installer\Cargo.toml

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: ipssh-${{ github.ref_name }}-windows-x64-installer
          path: dist/ipssh-0.1.0-windows-x64-installer.exe
          if-no-files-found: error
